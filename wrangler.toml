name = "tlock-worker"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# timelock.dev is attached to this Worker in the Cloudflare dashboard today, which `wrangler deploy` leaves alone.
# To manage the domain from config instead, uncomment:
# routes = [{ pattern = "timelock.dev", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "timelock-events"
# Replace with the id printed by `npx wrangler d1 create timelock-events` before deploying.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
